<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CXDI Community</title>
  <style>
    body { background-color: #0d0e12; color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 600px; }
    .card { background: #16181f; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2d37; }
    h2 { color: #e11d48; margin-top: 0; }
    a.btn { display: block; text-align: center; background: #e11d48; color: white; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏁 CXDI Community Beranda</h2>

    <div class="card" id="eventCard" style="display:none;">
      <h3>Event Aktif</h3>
      <div id="eventContent"></div>
    </div>

    <div class="card">
      <h3>Komunitas</h3>
      <a id="waBtn" href="#" class="btn" target="_blank" style="display:none;">Gabung WhatsApp</a>
      <a id="discordBtn" href="#" class="btn" target="_blank" style="display:none; background:#5865F2;">Gabung Discord</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://vemwhklbeknxrdcwyirxe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BunHy3v0BcX54Z_R9OBpkw__e03uXAH';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadIndexData() {
      try {
        const { data } = await db.from('site_config').select('*');
        if (data) {
          data.forEach(row => {
            if (row.key === 'wa' && row.value) {
              const btn = document.getElementById('waBtn');
              btn.href = row.value;
              btn.style.display = 'block';
            }
            if (row.key === 'discord' && row.value) {
              const btn = document.getElementById('discordBtn');
              btn.href = row.value;
              btn.style.display = 'block';
            }
            if (row.key === 'event' && row.value) {
              try {
                const ev = JSON.parse(row.value);
                if (ev.name) {
                  document.getElementById('eventCard').style.display = 'block';
                  document.getElementById('eventContent').innerHTML = `
                    <p><b>${ev.name}</b></p>
                    <p>📅 ${ev.date}</p>
                    <p>🏆 ${ev.prize}</p>
                    <a href="${ev.reg}" class="btn" target="_blank">Daftar Event</a>
                  `;
                }
              } catch(e){}
            }
          });
        }
      } catch (err) {}
    }
    loadIndexData();
  </script>
</body>
</html>
