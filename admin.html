<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CXDI Admin Login</title>
  <style>
    body { background-color: #0d0e12; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #16181f; padding: 25px; border-radius: 12px; width: 90%; max-width: 380px; border: 1px solid #2a2d37; text-align: center; }
    h2 { margin-bottom: 20px; font-weight: bold; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #2a2d37; background: #0d0e12; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #e11d48; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>CXDI Admin Login</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <input type="email" id="email" placeholder="Email" required value="zhoecbs@gmail.com">
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="loginBtn">Login Admin</button>
    </form>
  </div>

  <script>
    // URL dan Anon Key sudah terpasang otomatis dari data kamu
    const SUPABASE_URL = "https://vemwhklbeknxdcwyirxe.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlbXdoa2xiZWtueGRjd3lpcnhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MTY1MzEsImV4cCI6MjEwMzM5MjUzMX0.BnyX9No8YEYCNIvRR2RzsoaslOb8o2Ka4V_YHLboWYg";

    async function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      btn.innerText = "Memproses...";
      btn.disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          alert("Gagal Login: " + (data.error_description || data.msg || "Email atau password salah"));
        } else {
          alert("Login Berhasil!");
          localStorage.setItem('sb_access_token', data.access_token);
          window.location.href = "dashboard.html";
        }
      } catch (err) {
        alert("Gagal terhubung ke server Supabase.");
      } finally {
        btn.innerText = "Login Admin";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
