<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Google Sheets</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 sm:p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-xl font-bold mb-4 text-gray-800">Dashboard Data Spreadsheet</h1>
        
        <!-- Form Kirim/Update Data (POST) -->
        <div class="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <h2 class="text-md font-semibold mb-3 text-gray-700">Tambah / Update Data</h2>
            <input type="text" id="inputKey" placeholder="Nama Kunci (Key)" class="w-full p-2 mb-3 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="inputValue" placeholder="Nilai (Value)" class="w-full p-2 mb-3 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="saveData()" class="w-full bg-blue-600 text-white p-2 rounded text-sm font-medium hover:bg-blue-700 transition">Simpan Data</button>
            <p id="statusMsg" class="text-xs mt-2 text-center"></p>
        </div>

        <!-- Tampilan Data (GET) -->
        <div>
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-md font-semibold text-gray-700">Daftar Data Saat Ini</h2>
                <button onclick="loadData()" class="bg-gray-200 text-gray-700 px-2.5 py-1 rounded text-xs hover:bg-gray-300 transition">Muat Ulang</button>
            </div>
            <div id="dataContainer" class="border border-gray-200 rounded-lg p-3 bg-gray-50 min-h-[120px] max-h-[250px] overflow-y-auto text-sm">
                <p class="text-gray-400 text-center mt-8">Memuat data...</p>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwk-Q3NEZPsbr8GfBiiU6408G1_ND0Qj4Ret9P7tyyz9UYnX9K1IspHwrX-DMHaal96Og/exec";

        // Fungsi Mengambil Data (GET)
        async function loadData() {
            const container = document.getElementById('dataContainer');
            container.innerHTML = '<p class="text-gray-400 text-center mt-8">Memuat...</p>';
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (Object.keys(data).length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center mt-8">Belum ada data di spreadsheet.</p>';
                    return;
                }

                let html = '<ul class="divide-y divide-gray-200">';
                for (const [key, value] of Object.entries(data)) {
                    html += `<li class="py-2 flex justify-between items-center"><span class="font-medium text-gray-800">${key}</span> <span class="text-gray-600">${value}</span></li>`;
                }
                html += '</ul>';
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = '<p class="text-red-500 text-center mt-8">Gagal memuat data.</p>';
                console.error(error);
            }
        }

        // Fungsi Menyimpan Data (POST)
        async function saveData() {
            const key = document.getElementById('inputKey').value.trim();
            const value = document.getElementById('inputValue').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!key || !value) {
                statusMsg.textContent = "Key dan Value wajib diisi!";
                statusMsg.className = "text-xs mt-2 text-center text-red-500 font-medium";
                return;
            }

            statusMsg.textContent = "Menyimpan...";
            statusMsg.className = "text-xs mt-2 text-center text-blue-500 font-medium";

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8",
                    },
                    body: JSON.stringify({ key, value })
                });

                statusMsg.textContent = "Berhasil disimpan!";
                statusMsg.className = "text-xs mt-2 text-center text-green-600 font-medium";
                document.getElementById('inputKey').value = '';
                document.getElementById('inputValue').value = '';
                
                // Refresh data otomatis setelah 1 detik
                setTimeout(loadData, 1000);
            } catch (error) {
                statusMsg.textContent = "Gagal menyimpan!";
                statusMsg.className = "text-xs mt-2 text-center text-red-500 font-medium";
                console.error(error);
            }
        }

        // Jalankan saat pertama kali dibuka
        loadData();
    </script>
</body>
</html>
