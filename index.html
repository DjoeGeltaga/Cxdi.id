<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CXDI — CarX Street Drift Indo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cx: {
                            dark: '#060608',
                            card: '#0f0f13',
                            border: '#1f1f2e',
                            red: '#ff1e1e',
                            redhover: '#e01414',
                            accent: '#ff3366'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Rajdhani', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #060608; color: #f1f1f5; font-family: 'Inter', sans-serif; }
        .font-heading { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
        .glow-red { box-shadow: 0 0 25px rgba(255, 30, 30, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cx-red selection:text-white">

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-50 bg-cx-dark/90 backdrop-blur-md border-b border-cx-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Brand -->
            <div onclick="switchTab('home')" class="flex items-center space-x-3 cursor-pointer group">
                <div class="w-11 h-11 bg-cx-red rounded skew-x-[-12deg] flex items-center justify-center font-heading font-bold text-2xl text-white group-hover:bg-cx-redhover transition">
                    CX
                </div>
                <div>
                    <span class="font-heading font-bold text-2xl tracking-wider text-white">CXDI</span>
                    <span class="block text-[10px] text-gray-400 tracking-widest uppercase">CarX Street Drift Indo</span>
                </div>
            </div>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex items-center space-x-6">
                <button onclick="switchTab('home')" class="nav-btn text-sm font-semibold text-gray-300 hover:text-cx-red transition" data-target="home">Home</button>
                <button onclick="switchTab('events')" class="nav-btn text-sm font-semibold text-gray-300 hover:text-cx-red transition" data-target="events">Event</button>
                <button onclick="switchTab('gallery')" class="nav-btn text-sm font-semibold text-gray-300 hover:text-cx-red transition" data-target="gallery">Gallery</button>
                <button onclick="switchTab('community')" class="nav-btn text-sm font-semibold text-gray-300 hover:text-cx-red transition" data-target="community">Community</button>
                <button onclick="switchTab('admin')" class="bg-cx-border hover:bg-cx-red text-white px-4 py-2 rounded text-xs font-bold uppercase tracking-wider transition flex items-center gap-2">
                    <i class="fa-solid fa-lock text-[10px]"></i> Admin Panel
                </button>
            </nav>

            <!-- Mobile Menu Toggle -->
            <button onclick="toggleMobileMenu()" class="md:hidden text-gray-300 hover:text-white p-2 text-xl">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden bg-cx-card border-b border-cx-border px-4 py-4 space-y-3">
            <button onclick="switchTab('home'); toggleMobileMenu()" class="block w-full text-left py-2 text-gray-300 hover:text-cx-red font-semibold">Home</button>
            <button onclick="switchTab('events'); toggleMobileMenu()" class="block w-full text-left py-2 text-gray-300 hover:text-cx-red font-semibold">Event</button>
            <button onclick="switchTab('gallery'); toggleMobileMenu()" class="block w-full text-left py-2 text-gray-300 hover:text-cx-red font-semibold">Gallery</button>
            <button onclick="switchTab('community'); toggleMobileMenu()" class="block w-full text-left py-2 text-gray-300 hover:text-cx-red font-semibold">Community</button>
            <button onclick="switchTab('admin'); toggleMobileMenu()" class="block w-full text-left py-2 text-cx-red font-bold flex items-center gap-2">
                <i class="fa-solid fa-lock"></i> Admin Panel
            </button>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main id="app" class="flex-grow">
        <!-- Render dinamis via JavaScript murni, instan tanpa loading gantung -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-cx-card border-t border-cx-border py-10 mt-auto text-center">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-center space-x-3 mb-3">
                <div class="w-8 h-8 bg-cx-red rounded skew-x-[-12deg] flex items-center justify-center font-heading font-bold text-white text-sm">CX</div>
                <span class="font-heading font-bold text-xl text-white">CXDI</span>
            </div>
            <p class="text-gray-400 text-sm mb-4">Official CarX Street Drift Community in Indonesia. Angle, Smoke, & Tandem Battle.</p>
            <p class="text-gray-600 text-xs">&copy; 2026 CarX Street Drift Indo. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- SCRIPT UTAMA (INSTAN & AMAN DARI BLOKIR) -->
    <script>
        // Data Lokal Mockup (Aman dari kegagalan koneksi database external)
        const db = {
            events: [
                { id: 1, name: "CXDI Weekly Tandem Battle #12", date: "12 September 2026", time: "20:00 WIB", status: "Upcoming", desc: "Pertempuran tandem ketat di jalur pegunungan CarX Street.", img: "https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?q=80&w=800&auto=format&fit=crop" },
                { id: 2, name: "Sunset Drift Meet Up", date: "19 September 2026", time: "19:30 WIB", status: "Upcoming", desc: "Gathering santai, konvoi keliling kota, dan sesi foto bersama.", img: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=800&auto=format&fit=crop" }
            ],
            gallery: [
                { id: 1, title: "Night Skyline Angle", cat: "Tandem Drift", img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=800&auto=format&fit=crop" },
                { id: 2, title: "Custom Bodykit Showcase", cat: "Meet Up", img: "https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?q=80&w=800&auto=format&fit=crop" },
                { id: 3, title: "Smoke Session Sunset", cat: "Solo Drift", img: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=800&auto=format&fit=crop" }
            ]
        };

        function switchTab(tab) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            const app = document.getElementById('app');

            if (tab === 'home') {
                app.innerHTML = `
                    <!-- HERO SECTION -->
                    <section class="relative py-24 lg:py-36 overflow-hidden border-b border-cx-border bg-gradient-to-b from-black via-cx-dark to-cx-card">
                        <div class="absolute inset-0 z-0 opacity-20 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?q=80&w=1600&auto=format&fit=crop');"></div>
                        <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="max-w-3xl">
                                <span class="text-cx-red font-bold text-xs tracking-widest uppercase bg-cx-red/10 px-3 py-1 rounded border border-cx-red/20 inline-block mb-4">Indonesian Drift Culture</span>
                                <h1 class="font-heading font-extrabold text-5xl sm:text-7xl lg:text-8xl tracking-tight text-white mb-6 uppercase">
                                    MASTER THE <span class="text-cx-red">ANGLE.</span>
                                </h1>
                                <p class="text-gray-300 text-lg sm:text-xl mb-8 leading-relaxed">
                                    Platform utama komunitas drifter mobile CarX Street di Indonesia. Ajang kumpul, adu setup, dan turnamen tandem paling bergengsi.
                                </p>
                                <div class="flex flex-col sm:flex-row gap-4">
                                    <a href="https://chat.whatsapp.com" target="_blank" class="bg-cx-red hover:bg-cx-redhover text-white font-bold px-8 py-4 rounded text-center transition flex items-center justify-center gap-3 glow-red">
                                        <i class="fa-brands fa-whatsapp text-xl"></i> Join WhatsApp Group
                                    </a>
                                    <a href="https://discord.gg" target="_blank" class="bg-cx-card hover:bg-cx-border border border-cx-border text-white font-bold px-8 py-4 rounded text-center transition flex items-center justify-center gap-3">
                                        <i class="fa-brands fa-discord text-xl"></i> Join Discord Server
                                    </a>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- STATS -->
                    <section class="max-w-7xl mx-auto px-4 py-12">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-cx-card border border-cx-border p-6 rounded-xl text-center">
                                <span class="block font-heading font-bold text-4xl text-cx-red mb-1">500+</span>
                                <span class="text-xs text-gray-400 tracking-wider uppercase font-semibold">Active Drivers</span>
                            </div>
                            <div class="bg-cx-card border border-cx-border p-6 rounded-xl text-center">
                                <span class="block font-heading font-bold text-4xl text-white mb-1">24/7</span>
                                <span class="text-xs text-gray-400 tracking-wider uppercase font-semibold">Tandem Session</span>
                            </div>
                            <div class="bg-cx-card border border-cx-border p-6 rounded-xl text-center">
                                <span class="block font-heading font-bold text-4xl text-cx-red mb-1">50+</span>
                                <span class="text-xs text-gray-400 tracking-wider uppercase font-semibold">Events Held</span>
                            </div>
                            <div class="bg-cx-card border border-cx-border p-6 rounded-xl text-center">
                                <span class="block font-heading font-bold text-4xl text-white mb-1">100%</span>
                                <span class="text-xs text-gray-400 tracking-wider uppercase font-semibold">Solidarity</span>
                            </div>
                        </div>
                    </section>

                    <!-- ABOUT PREVIEW -->
                    <section class="max-w-7xl mx-auto px-4 py-16 border-t border-cx-border">
                        <div class="grid md:grid-cols-2 gap-12 items-center">
                            <div>
                                <span class="text-cx-red font-bold text-xs tracking-widest uppercase block mb-2">Tentang Kami</span>
                                <h2 class="font-heading font-bold text-4xl text-white mb-6">More Than Just a Game, It’s a Lifestyle.</h2>
                                <p class="text-gray-300 mb-4 leading-relaxed">
                                    CXDI dibentuk dari kecintaan yang sama terhadap dunia drifting virtual di CarX Street. Kami mewadahi para drifter dari berbagai region di Indonesia untuk menyalurkan kreativitas livery, setup mobil, dan skill tandem.
                                </p>
                                <button onclick="switchTab('events')" class="mt-4 text-cx-red font-bold flex items-center gap-2 hover:underline">
                                    Lihat Jadwal Kompetisi <i class="fa-solid fa-arrow-right text-xs"></i>
                                </button>
                            </div>
                            <div class="bg-cx-card border border-cx-border p-2 rounded-xl overflow-hidden shadow-2xl">
                                <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1000&auto=format&fit=crop" class="w-full h-72 object-cover rounded hover:scale-105 transition duration-500" alt="Car">
                            </div>
                        </div>
                    </section>
                `;
            } else if (tab === 'events') {
                let htmlEvents = db.events.map(ev => `
                    <div class="bg-cx-card border border-cx-border rounded-xl overflow-hidden flex flex-col justify-between hover:border-cx-red transition duration-300">
                        <div>
                            <div class="h-48 relative overflow-hidden bg-black">
                                <img src="${ev.img}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                                <span class="absolute top-3 right-3 bg-amber-500 text-black font-bold text-xs px-3 py-1 rounded uppercase tracking-wider">${ev.status}</span>
                            </div>
                            <div class="p-6">
                                <div class="text-xs text-cx-red font-semibold mb-2 flex items-center gap-4">
                                    <span><i class="fa-solid fa-calendar mr-1"></i> ${ev.date}</span>
                                    <span><i class="fa-solid fa-clock mr-1"></i> ${ev.time}</span>
                                </div>
                                <h3 class="font-heading font-bold text-2xl text-white mb-2">${ev.name}</h3>
                                <p class="text-gray-400 text-sm">${ev.desc}</p>
                            </div>
                        </div>
                        <div class="p-6 pt-0">
                            <button onclick="alert('Silakan bergabung ke grup WhatsApp atau Discord CXDI untuk mendaftar event!')" class="w-full bg-cx-border hover:bg-cx-red text-white py-3 rounded-lg font-bold text-sm transition">
                                Daftar / Ikuti Event
                            </button>
                        </div>
                    </div>
                `).join('');

                app.innerHTML = `
                    <div class="max-w-7xl mx-auto px-4 py-16">
                        <div class="mb-10">
                            <span class="text-cx-red font-bold text-xs tracking-widest uppercase">Kompetisi Resmi</span>
                            <h1 class="font-heading font-bold text-4xl text-white">CXDI Drift Events</h1>
                        </div>
                        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">${htmlEvents}</div>
                    </div>
                `;
            } else if (tab === 'gallery') {
                let htmlGallery = db.gallery.map(item => `
                    <div class="bg-cx-card border border-cx-border rounded-xl overflow-hidden group">
                        <div class="h-64 overflow-hidden relative bg-black">
                            <img src="${item.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <span class="absolute top-3 left-3 bg-black/70 backdrop-blur text-cx-red text-xs px-3 py-1 rounded font-bold">${item.cat}</span>
                        </div>
                        <div class="p-4">
                            <h4 class="font-heading font-bold text-lg text-white">${item.title}</h4>
                        </div>
                    </div>
                `).join('');

                app.innerHTML = `
                    <div class="max-w-7xl mx-auto px-4 py-16">
                        <div class="mb-10">
                            <span class="text-cx-red font-bold text-xs tracking-widest uppercase">Arsip Media</span>
                            <h1 class="font-heading font-bold text-4xl text-white">CXDI Gallery</h1>
                        </div>
                        <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-6">${htmlGallery}</div>
                    </div>
                `;
            } else if (tab === 'community') {
                app.innerHTML = `
                    <div class="max-w-4xl mx-auto px-4 py-20 text-center">
                        <span class="text-cx-red font-bold text-xs tracking-widest uppercase">Gabung Komunitas</span>
                        <h1 class="font-heading font-bold text-4xl text-white mb-8">Connect With The Crew</h1>
                        <div class="grid md:grid-cols-2 gap-6 text-left">
                            <div class="bg-cx-card border border-cx-border p-8 rounded-xl flex flex-col items-center text-center">
                                <i class="fa-brands fa-whatsapp text-6xl text-cx-red mb-4"></i>
                                <h3 class="font-heading font-bold text-2xl text-white mb-2">WhatsApp Group</h3>
                                <p class="text-gray-400 text-sm mb-6">Diskusi harian, mabar room, info setup mobil, dan konvoi bareng.</p>
                                <a href="https://chat.whatsapp.com" target="_blank" class="w-full bg-cx-red hover:bg-cx-redhover text-white font-bold py-3 rounded-lg transition">Join WhatsApp</a>
                            </div>
                            <div class="bg-cx-card border border-cx-border p-8 rounded-xl flex flex-col items-center text-center">
                                <i class="fa-brands fa-discord text-6xl text-white mb-4"></i>
                                <h3 class="font-heading font-bold text-2xl text-white mb-2">Discord Server</h3>
                                <p class="text-gray-400 text-sm mb-6">Voice channel mabar, turnamen resmi, event battle, dan sharing galeri.</p>
                                <a href="https://discord.gg" target="_blank" class="w-full bg-cx-border hover:bg-cx-red text-white font-bold py-3 rounded-lg transition">Join Discord</a>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tab === 'admin') {
                app.innerHTML = `
                    <div class="max-w-md mx-auto px-4 py-20">
                        <div class="bg-cx-card border border-cx-border p-8 rounded-xl shadow-2xl">
                            <div class="text-center mb-6">
                                <span class="text-cx-red font-bold text-xs tracking-widest uppercase">Restricted Area</span>
                                <h2 class="font-heading font-bold text-3xl text-white">Admin Access</h2>
                            </div>
                            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Email Admin</label>
                                    <input type="email" id="admin-email" required class="w-full bg-cx-dark border border-cx-border rounded-lg p-3 text-white focus:border-cx-red outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Password</label>
                                    <input type="password" id="admin-pass" required class="w-full bg-cx-dark border border-cx-border rounded-lg p-3 text-white focus:border-cx-red outline-none">
                                </div>
                                <button type="submit" class="w-full bg-cx-red hover:bg-cx-redhover text-white font-bold py-3 rounded-lg transition">LOGIN</button>
                            </form>
                            <div class="mt-4 text-center">
                                <button onclick="switchTab('home')" class="text-xs text-gray-400 hover:text-white">&larr; Kembali ke Beranda</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            alert('Login berhasil (Simulasi Dashboard Aktif)!');
            document.getElementById('app').innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-16">
                    <div class="flex justify-between items-center mb-8 border-b border-cx-border pb-6">
                        <div>
                            <span class="text-cx-red font-bold text-xs tracking-widest uppercase">Admin Panel</span>
                            <h1 class="font-heading font-bold text-4xl text-white">Dashboard Control</h1>
                        </div>
                        <button onclick="switchTab('home')" class="bg-red-950 text-cx-red hover:bg-cx-red hover:text-white px-4 py-2 rounded-lg text-sm font-bold transition">Logout</button>
                    </div>
                    <div class="bg-cx-card border border-cx-border p-8 rounded-xl text-center">
                        <h3 class="font-heading font-bold text-2xl text-white mb-2">Panel Kontrol Utama Siap Digunakan</h3>
                        <p class="text-gray-400 text-sm">Semua sistem berjalan lancar dan instan tanpa kendala loading eksternal.</p>
                    </div>
                </div>
            `;
        }

        // Muat halaman utama otomatis saat pertama kali dibuka
        window.addEventListener('DOMContentLoaded', () => {
            switchTab('home');
        });

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }
    </script>
</body>
</html>
