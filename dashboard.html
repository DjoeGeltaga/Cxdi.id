<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CXDI Admin Cloud Panel</title>
  <style>
    body { background-color: #0d0e12; color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 600px; }
    .card { background: #16181f; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2d37; }
    h2 { color: #e11d48; margin-top: 0; font-size: 20px; }
    h3 { font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #2a2d37; padding-bottom: 8px; }
    label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #2a2d37; background: #0d0e12; color: white; box-sizing: border-box; font-size: 14px; }
    textarea { resize: vertical; height: 80px; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #e11d48; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
    button:hover { background: #be123c; }
    .btn-logout { background: #374151; margin-top: 10px; width: auto; padding: 8px 15px; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>☁️ CXDI Cloud Admin Panel</h2>
      <button type="button" onclick="handleLogout()" class="btn-logout">Logout & ke Beranda</button>
    </div>

    <div class="card">
      <h3>🔗 Link Komunitas & Sosmed</h3>
      <form onsubmit="saveConfig(event, 'links'); return false;">
        <label>Link WhatsApp</label>
        <input type="url" id="waLink" required>
        <label>Link Discord</label>
        <input type="url" id="discordLink" required>
        <button type="submit">Simpan Link</button>
      </form>
    </div>

    <div class="card">
      <h3>🏁 Event & Pendaftaran</h3>
      <form onsubmit="saveConfig(event, 'event'); return false;">
        <label>URL Poster Foto Event</label>
        <input type="url" id="evImg" placeholder="Link gambar (Imgur/GitHub/dll)" required>
        <label>Nama Event</label>
        <input type="text" id="evName" required>
        <label>Tanggal & Waktu</label>
        <input type="text" id="evDate" required>
        <label>Class</label>
        <input type="text" id="evClass" required>
        <label>Hadiah</label>
        <input type="text" id="evPrize" required>
        <label>Rules Event</label>
        <textarea id="evRules" required></textarea>
        <label>Link Pendaftaran</label>
        <input type="url" id="evReg" required>
        <button type="submit">Publikasikan Event</button>
      </form>
    </div>

    <div class="card">
      <h3>📸 Upload Galeri Event Publik</h3>
      <form onsubmit="saveConfig(event, 'gallery'); return false;">
        <label>Judul / Nama Galeri</label>
        <input type="text" id="galTitle" placeholder="Contoh: Keseruan Event Rally Drift" required>
        <label>URL Foto Galeri</label>
        <input type="url" id="galImg" placeholder="Link gambar galeri (Imgur/GitHub/dll)" required>
        <label>Deskripsi Galeri</label>
        <textarea id="galDesc" placeholder="Keterangan singkat tentang galeri event..." required></textarea>
        <button type="submit">Upload Galeri Publik</button>
      </form>
    </div>

    <div class="card">
      <h3>📅 Jadwal Pertandingan</h3>
      <form onsubmit="saveConfig(event, 'schedule'); return false;">
        <textarea id="schedDesc" required></textarea>
        <button type="submit">Simpan Jadwal</button>
      </form>
    </div>

    <div class="card">
      <h3>📜 Rules Grup</h3>
      <form onsubmit="saveConfig(event, 'rules'); return false;">
        <textarea id="groupRules" required></textarea>
        <button type="submit">Simpan Rules</button>
      </form>
    </div>

    <div class="card">
      <h3>🤝 Sponsor</h3>
      <form onsubmit="saveConfig(event, 'sponsors'); return false;">
        <textarea id="sponsorList" required></textarea>
        <button type="submit">Simpan Sponsor</button>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCafO3zY9poaEW9EbL1eB7NhWlozvVvgZQyhaQ-m8JxTtTQhiG3zXVlTCRJGojJ1-iRQ/exec";

    function handleLogout() {
      try {
        localStorage.clear();
      } catch (e) {}
      window.location.href = "index.html";
    }

    async function loadData() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        if (data) {
          if (data.wa) document.getElementById('waLink').value = data.wa;
          if (data.discord) document.getElementById('discordLink').value = data.discord;
          if (data.schedule) document.getElementById('schedDesc').value = data.schedule;
          if (data.rules) document.getElementById('groupRules').value = data.rules;
          if (data.sponsors) document.getElementById('sponsorList').value = data.sponsors;
          
          if (data.event) {
            try {
              const ev = JSON.parse(data.event);
              document.getElementById('evImg').value = ev.img || '';
              document.getElementById('evName').value = ev.name || '';
              document.getElementById('evDate').value = ev.date || '';
              document.getElementById('evClass').value = ev.cls || '';
              document.getElementById('evPrize').value = ev.prize || '';
              document.getElementById('evRules').value = ev.rules || '';
              document.getElementById('evReg').value = ev.reg || '';
            } catch (e) {}
          }

          if (data.gallery) {
            try {
              const gal = JSON.parse(data.gallery);
              document.getElementById('galTitle').value = gal.title || '';
              document.getElementById('galImg').value = gal.img || '';
              document.getElementById('galDesc').value = gal.desc || '';
            } catch (e) {}
          }
        }
      } catch (err) {
        console.error("Gagal memuat data Google Sheets:", err);
      }
    }

    window.onload = function() {
      loadData();
    };

    async function sendData(key, value) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8",
        },
        body: JSON.stringify({ key, value })
      });
    }

    async function saveConfig(e, type) {
      e.preventDefault();
      try {
        if (type === 'links') {
          await sendData('wa', document.getElementById('waLink').value);
          await sendData('discord', document.getElementById('discordLink').value);
          alert("Link berhasil disimpan ke Google Sheets!");
        } else if (type === 'event') {
          const evData = {
            img: document.getElementById('evImg').value,
            name: document.getElementById('evName').value,
            date: document.getElementById('evDate').value,
            cls: document.getElementById('evClass').value,
            prize: document.getElementById('evPrize').value,
            rules: document.getElementById('evRules').value,
            reg: document.getElementById('evReg').value
          };
          await sendData('event', JSON.stringify(evData));
          alert("Event berhasil dipublikasikan ke Google Sheets!");
        } else if (type === 'gallery') {
          const galData = {
            title: document.getElementById('galTitle').value,
            img: document.getElementById('galImg').value,
            desc: document.getElementById('galDesc').value
          };
          await sendData('gallery', JSON.stringify(galData));
          alert("Galeri publik berhasil di-upload ke Google Sheets!");
        } else if (type === 'schedule') {
          await sendData('schedule', document.getElementById('schedDesc').value);
          alert("Jadwal berhasil disimpan ke Google Sheets!");
        } else if (type === 'rules') {
          await sendData('rules', document.getElementById('groupRules').value);
          alert("Rules berhasil disimpan ke Google Sheets!");
        } else if (type === 'sponsors') {
          await sendData('sponsors', document.getElementById('sponsorList').value);
          alert("Sponsor berhasil disimpan ke Google Sheets!");
        }
        
        setTimeout(loadData, 1000);
      } catch (err) {
        alert("Gagal menyimpan: " + err.message);
      }
    }
  </script>
</body>
</html>
