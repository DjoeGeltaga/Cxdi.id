<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CXDI Admin Dashboard</title>
  <style>
    body { background-color: #0d0e12; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #16181f; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #2a2d37; text-align: center; }
    h2 { margin-bottom: 10px; color: #e11d48; }
    p { color: #9ca3af; margin-bottom: 20px; font-size: 14px; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #e11d48; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #be123c; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Selamat Datang, Admin!</h2>
    <p>Kamu berhasil masuk ke halaman utama Dashboard CXDI.</p>
    <button onclick="handleLogout()">Keluar (Logout)</button>
  </div>

  <script>
    // Cek apakah admin sudah punya token login atau belum
    const token = localStorage.getItem('sb_access_token');
    if (!token) {
      // Jika belum login, tendang balik ke halaman admin.html
      alert("Sesi habis atau belum login. Silakan login ulang.");
      window.location.href = "admin.html";
    }

    function handleLogout() {
      // Hapus token dan kembali ke halaman login
      localStorage.removeItem('sb_access_token');
      window.location.href = "admin.html";
    }
  </script>
</body>
</html>
