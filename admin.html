<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CXDI Admin Login</title>
  <!-- Library Supabase CDN wajib ada -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0d0e12; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #16181f; padding: 25px; border-radius: 12px; width: 90%; max-width: 380px; border: 1px solid #2a2d37; text-align: center; }
    h2 { margin-bottom: 20px; font-weight: bold; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #2a2d37; background: #0d0e12; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #e11d48; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>CXDI Admin Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required value="zhoecbs@gmail.com">
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="loginBtn">Login Admin</button>
    </form>
  </div>

  <script>
    // 1. ISI DENGAN SUPABASE URL & ANON KEY MILIKMU
    const SUPABASE_URL = "https://PROJECT_ID_KAMU.supabase.co";
    const SUPABASE_KEY = "ANON_KEY_SUPABASE_KAMU";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    // 2. Event Listener Form Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault(); // Mencegah reload halaman
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      loginBtn.innerText = "Proses Login...";
      loginBtn.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          alert("Gagal Login: " + error.message);
        } else {
          alert("Login Berhasil!");
          // Arahkan ke halaman dashboard admin (sesuaikan nama filenya)
          window.location.href = "dashboard.html"; 
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi atau konfigurasi Supabase belum benar.");
        console.error(err);
      } finally {
        loginBtn.innerText = "Login Admin";
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
